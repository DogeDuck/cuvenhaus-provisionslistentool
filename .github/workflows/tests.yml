name: Cuvenhaus regression tests
on:
  push:
    branches: [main, feature/provision-suite-v2, fix/wochenendlisten-getrennt, feature/gemeinsame-einsaetze-fp-pruefer, perf/batch-standortdaten , ui/adac-dark-karten-filter-mobil, feature/provi-waechter-fp-kalender-csv]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall -q ProviProject-WebApp.py cuvenhaus_suite.py ki_assistent.py provi_befehl.py fp_karte.py monatsarchiv.py zugang.py autosicherung.py wochenlisten.py provi_erweiterungen.py strassenkilometer.py csv_versionsvergleich.py provisions_waechter.py bereitschaftskalender.py
      - name: Unit tests
        run: python -m unittest discover -p "test_*.py" -v
